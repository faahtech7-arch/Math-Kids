<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Math Kids — Suas fases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/jogo.css">
<link rel="stylesheet" href="css/recompensas.css">
</head>
<body>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<div class="jogo-topo">
  <div class="avatar-face" id="avatarFace"></div>
  <div class="quem">
    <p>Bora jogar,</p>
    <h1 id="avatarNome">—</h1>
  </div>
  <span class="placar-estrelas">⭐ <span id="totalEstrelas">0</span>/<span id="maxEstrelas">39</span></span>
  <button class="btn-sair" id="btnSair">Sair</button>
</div>

<!-- Épico 4: o painel "Meu progresso" é outra página; a Galeria de Conquistas
     abre como janela por cima do menu (js/galeria.js), sem sair daqui. -->
<nav class="atalhos" aria-label="Meu progresso e minhas conquistas">
  <a class="atalho progresso" href="progresso.html">
    <span class="atalho-icone" aria-hidden="true">📊</span>
    <span class="atalho-texto">
      <b>Meu progresso</b>
      <small>Fases, pontos e medalhas</small>
    </span>
  </a>
  <button type="button" class="atalho conquistas" id="btnConquistas">
    <span class="atalho-icone" aria-hidden="true">🏆</span>
    <span class="atalho-texto">
      <b>Conquistas</b>
      <small id="conquistasResumo">Veja sua galeria</small>
    </span>
    <span class="selo-nova" id="conquistasSelo" hidden>NOVA!</span>
  </button>
</nav>

<main class="mapa">
  <h2>Fases</h2>
  <div class="fases-grid" id="gridFases"></div>

  <h2>Fases extras 🎁</h2>
  <div class="fases-grid" id="gridExtras"></div>
</main>

<script type="module" src="js/jogar.js"></script>
</body>
</html>
